<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Page where the Data is send" />
    <meta name="author" content="Michael und Thore" />
    <meta name="keywords" content="html, lernen, studium" />
    <link rel="stylesheet" href="css/global.css" />
    <title>SendToPage</title>
  </head>
  <body>
    <h1>Data</h1>

    <div>
      <header>
        <picture>
          <source
            media="(min-width: 1920px)"
            srcset="content/pictures/header1920x200.png"
          />
          <source
            media="(min-width: 1280px)"
            srcset="content/pictures/header1280x133.png"
          />
          <source
            media="(min-width: 640px)"
            srcset="content/pictures/header640x67.png"
          />
          <source
            media="(min-width: 320px)"
            srcset="content/pictures/header320x34.png"
          />
          <img
            src="content/pictures/header1920x200.png"
            alt="Here is a picture"
            style="width: auto"
          />
        </picture>
      </header>
      <fieldset class="login-header">
        <legend>Anmelden</legend>
        <form class="login-form" action="Projects.html">
          <label for="benutzername">Benutzername</label>
          <input type="text" id="benutzername" name="benutzername" />

          <label for="passwort">Passwort</label>
          <input type="password" id="passwort" name="passwort" />

          <button class="button" type="submit">Anmelden</button>
        </form>
        <a class="login-register" href="Register.html">Registrieren</a>
      </fieldset>
    </div>

    <footer class="end">
      <div>
        <section>
          <nav>
            <ul>
              <li><a href="https://google.com">Impressum</a></li>
              <li><a href="https://google.com">Datenschutz</a></li>
              <li><a href="https://google.com">Haftungsausschluss</a></li>
              <li><a href="https://google.com">Copyright</a></li>
            </ul>
          </nav>
          <a id="back-to-top" href="#top">Zum Anfang</a>
        </section>
      </div>
    </footer>
  </body>
</html>
