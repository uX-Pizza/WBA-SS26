<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="Projects" content="A list of all Projects" />
    <meta name="author" content="Michael und Thore" />
    <meta name="keywords" content="html, lernen, studium" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/projects.css" />
    <script type="module" src="../js/appfilter.js"></script>
    <script src="../js/Login.js" defer></script>
    <script type="module" src="../js/translation.js"></script>
    <title>Projects</title>
  </head>
  <body>
    <div>
      <header>
        <picture>
          <source
            media="(min-width: 1920px)"
            srcset="../content/pictures/header1920x200.png"
          />
          <source
            media="(min-width: 1280px)"
            srcset="../content/pictures/header1280x133.png"
          />
          <source
            media="(min-width: 640px)"
            srcset="../content/pictures/header640x67.png"
          />
          <source
            media="(min-width: 320px)"
            srcset="../content/pictures/header320x34.png"
          />
          <img
            src="../content/pictures/header1920x200.png"
            alt="Here is a picture"
            style="width: auto"
          />
        </picture>
        <fieldset class="login-header">
          <legend data-i18n="login">Anmelden</legend>
          <form class="login-form" action="Projects.html">
            <label for="benutzername" data-i18n="userName">Benutzername</label>
            <input type="text" id="benutzername" name="benutzername" />

            <label for="passwort" data-i18n="password">Passwort</label>
            <input type="password" id="passwort" name="passwort" />

            <button class="button" type="submit" data-i18n="login">
              Anmelden
            </button>
          </form>
          <a class="login-register" href="Register.html" data-i18n="register"
            >Registrieren</a
          >
        </fieldset>
      </header>
    </div>

    <section class="header_links">
      <a href="index.html">
        <img
          src="../content/pictures/home-button-svgrepo-com.svg"
          alt="Startseite"
          width="75"
          height="75"
        />
      </a>
        <select id="language-switcher" name="language-switcher">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
    </section>
    <div class="filter">
      <form id="filterForm">
        <p>Filter Optionen</p>
        <input type="radio" id="date" name="filter" value="date" />
        <label for="date">Anfangsdatum</label><br />
        <input type="radio" id="duration" name="filter" value="duration" />
        <label for="duration">Laufzeit</label><br />
      </form>
    </div>
    <div class="projects-container">
      <table>
        <thead>
          <tr>
            <th>Projektname</th>
            <th>Beschreibung</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody id="projectsTableBody">
          <tr>
            <td class="title">Project1</td>
            <td>Spacestation</td>
            <td>
              <a href="SingleProject.html" data-i18n="projectDetails"
                >Zu den Projektdetails</a
              >
            </td>
          </tr>
          <tr>
            <td class="title">Project2</td>
            <td>Bildverarbeitung</td>
            <td>
              <a href="SingleProject.html" data-i18n="projectDetails"
                >Zu den Projektdetails</a
              >
            </td>
          </tr>
          <tr>
            <td class="title">Project3</td>
            <td>Webseite</td>
            <td>
              <a href="SingleProject.html" data-i18n="projectDetails"
                >Zu den Projektdetails</a
              >
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <footer class="end">
      <div>
        <section>
          <nav>
            <ul>
              <li><a href="https://google.com">Impressum</a></li>
              <li><a href="https://google.com">Datenschutz</a></li>
              <li><a href="https://google.com">Haftungsausschluss</a></li>
              <li><a href="https://google.com">Copyright</a></li>
              <a id="back-to-top" href="#top">Zum Anfang</a>
            </ul>
          </nav>
        </section>
      </div>
    </footer>
  </body>
</html>
