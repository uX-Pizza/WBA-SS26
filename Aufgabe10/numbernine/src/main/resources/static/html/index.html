<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Startseite" />
    <meta name="author" content="Michael und Thore" />
    <meta name="keywords" content="html, lernen, studium" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/Login.js" defer></script>
    <script type="module" src="../js/translation.js"></script>
    <script src="../js/newest3Projects.js" defer></script>
    <title>Startseite</title>
  </head>

  <body>
    <div>
      <header>
        <picture>
          <source
            media="(min-width: 1920px)"
            srcset="../content/pictures/header1920x200.png"
          />
          <source
            media="(min-width: 1280px)"
            srcset="../content/pictures/header1280x133.png"
          />
          <source
            media="(min-width: 640px)"
            srcset="../content/pictures/header640x67.png"
          />
          <source
            media="(min-width: 320px)"
            srcset="../content/pictures/header320x34.png"
          />
          <img
            src="../content/pictures/header1920x200.png"
            srcset="
              ../content/pictures/header1280x133.png 1280w,
              ../content/pictures/header640x67.png    640w,
              ../content/pictures/header320x34.png    320w
            "
            alt="Header"
          />
        </picture>
        <fieldset class="login-header">
          <legend data-i18n="login">Anmelden</legend>
          <form class="login-form" action="index.html" method="post">
            <label for="benutzername" data-i18n="userName" >Benutzername</label>
            <input type="text" id="benutzername" name="benutzername" />

            <label for="passwort" data-i18n="password">Passwort</label>
            <input type="password" id="passwort" name="passwort" />

            <button class="button" type="submit" data-i18n="login">
              Anmelden
            </button>
          </form>
          <a class="login-register" href="Register.html" data-i18n="register"
            >Registrieren</a
          >
        </fieldset>
      </header>
    </div>
    <div>
      <section class="header_links">
        <a href="index.html">
          <img
            src="../content/pictures/home-button-svgrepo-com.svg"
            alt="Startseite"
            width="75"
            height="75"
          />
        </a>

        <a href="NewProject.html" data-i18n="newProject">Neues Projekt</a>

        <a href="Projects.html" data-i18n="openProjects">Projekt öffnen</a>

  
        <select id="language-switcher" name="language-switcher">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
        </select>
      </section>
    </div>
    <h1 class="animated-welcome">
      <span class="welcome-line welcome-line-1" data-i18n="welcomeToOurSite">Welcome auf unserer Seite</span>
      <br />
      <span class="welcome-line welcome-line-2">Viel Spaß</span>
    </h1>
    <div class="description">
      <section class="text-and-video">
        <p>Hier ist eine tolle erklärung unserer Seite mit allen Features</p>
        <video width="320" height="240" controls autoplay loop>
          <source src="../content/videos/space_video.mp4" type="video/mp4" />
          Your browser does not support the video tag
        </video>
      </section>
      <section class="projects">
        <table>
          <thead>
            <tr>
              <td>Current Projects</td>
              <td colspan="2">Sorted by</td>
            </tr>
          </thead>
          <tbody id="latest-projects-body"></tbody>
        </table>
      </section>
    </div>
    <footer class="end">
      <section>
        <nav>
          <ul>
            <li><a href="https://google.com">Impressum</a></li>
            <li><a href="https://google.com">Datenschutz</a></li>
            <li><a href="https://google.com">Haftungsausschluss</a></li>
            <li><a href="https://google.com">Copyright</a></li>
            <a id="back-to-top" href="#top">Zum Anfang</a>
          </ul>
        </nav>
      </section>
    </footer>
  </body>
</html>
