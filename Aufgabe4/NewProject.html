<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="declare a new project">
    <meta name="author" content="Michael und Thore">
    <meta name="keywords" content="html, lernen, studium">


    <title>NewProject</title>
    <!-- <link rel="stylesheet" href="css/NewProject.css"> -->
</head>
<body>
    <div>
        <header>
            <picture>
                <source media="(min-width: 1920px)" srcset="content/pictures/header1920x200.png">
                <source media="(min-width: 1280px)" srcset="content/pictures/header1280x133.png">
                <source media="(min-width: 640px)" srcset="content/pictures/header640x67.png">
                <source media="(min-width: 320px)" srcset="content/pictures/header320x34.png">
                <img src="content/pictures/header1920x200.png" alt="Here is a picture" style="width:auto;">
            </picture>
            <fieldset class="login-header">
                <legend>Anmelden</legend>
                <form class="login-form" action="Projects.html">
                    <label for="benutzername">Benutzername</label>
                    <input type="text" id="benutzername" name="benutzername">

                    <label for="passwort">Passwort</label>
                    <input type="password" id="passwort" name="passwort">

                    <button class="button" type="submit">Anmelden</button>
                </form>
                <a class="login-register" href="Register.html">Registrieren</a>
            </fieldset>
        </header>
    </div>

    <div>
        <section class="header_links">
            <a href="index.html">
                <img src="content/pictures/home-button-svgrepo-com.svg" alt="Startseite" width="75" height="75">
            </a>
        </section>

        <section class="header_links">
            <a href="Projects.html">Projekt öffnen</a>
        </section>

    <form action="SendToPage.html"
    method="post">
        <label for="projekt_name">Projekt Name</label>
        <input type="text" id="projekt_name" name="projekt_name">
        <br>

        <label for="startdatum">Startdatum</label>
        <input type="date" id="startdatum" name="startdatum">
        <br>
        <label for="enddatum">Enddatum</label>
        <input type="date" id="enddatum" name="enddatum">
        <br>

        <label for="Kurzbeschreibung">Kurzbeschreibung</label>
        <input type="text" id="kurzbeschreibung" name="kurzbeschreibung">
        <br>

        <label for="Langbeschreibung">Langbeschreibung</label>
        <input type="text" id="langbeschreibung" name="langbeschreibung">
        <br>

        <label for="Projekziele">Projekt Ziele</label>
        <input type="text" id="projekt_ziel" name="projekt_ziel">
        <br>

        <label for="Projekziele">Logo Hochladen</label>
        <input type="file" id="myFile" name="filename">
        <br>

        <button class="button" type="submit">Submit</button>
    </form>
    <a href="SendToPage.html">Daten Hier</a>


    <footer class="end">
        <div>
            <section>
                <nav>
                    <ul>
                        <li><a href="https://google.com">Impressum</a></li>
                        <li><a href="https://google.com">Datenschutz</a></li>
                        <li><a href="https://google.com">Haftungsausschluss</a></li>
                        <li><a href="https://google.com">Copyright</a></li>
                    </ul>
                </nav>
                <a id="back-to-top" href="#top">Zum Anfang</a>
            </section>
        </div>
    </footer>
</body>
</html>
